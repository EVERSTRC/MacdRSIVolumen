<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estrategia BTC - Divergencias</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #121826;
      color: #e0e6ed;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .alert-box {
      padding: 15px;
      border-radius: 6px;
      background-color: #2b1f31;
      border-left: 5px solid #ff4d4d;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ff6b6b;
    }
    .chart-box {
      background: #1e2738;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    canvas {
      width: 100% !important;
      max-height: 220px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Estrategia BTC/USDT: Divergencia RSI + MACD + Volumen</h2>

  <div id="alertBox" class="alert-box">
    Cargando motor de análisis...
  </div>

  <div class="chart-box"><canvas id="priceChart"></canvas></div>
  <div class="chart-box"><canvas id="rsiChart"></canvas></div>
  <div class="chart-box"><canvas id="macdChart"></canvas></div>
  <div class="chart-box"><canvas id="volumeChart"></canvas></div>
</div>

<script>
  // Datos históricos para BTC/USDT
  const timeLabels = ['10:00', '11:00', '12:00 (Pico 1)', '13:00', '14:00', '15:00 (Pico 2)', '16:00', '17:00'];
  const priceData  = [61000, 62500, 64000, 62800, 63500, 65200, 63000, 61500]; // Precio sube en Pico 2
  const rsiData    = [48,    62,    79,    58,    64,    68,    45,    36];    // RSI cae en Pico 2
  const macdData   = [120,   250,   480,   180,   220,   310,  -50,   -280];  // MACD cae en Pico 2
  const volumeData = [1200,  1800,  3100,  1400,  1600,  1900,  2200,  2800];  // Volumen cae en Pico 2

  // Detección lógica de la divergencia
  const p1_price = priceData[2], p2_price = priceData[5];
  const p1_rsi = rsiData[2], p2_rsi = rsiData[5];
  const p1_vol = volumeData[2], p2_vol = volumeData[5];

  const alertBox = document.getElementById('alertBox');

  if (p2_price > p1_price && p2_rsi < p1_rsi && p2_vol < p1_vol) {
    alertBox.innerHTML = `⚠️ SEÑAL DE VENTA DETECTADA (Confianza: 85%)<br>` +
      `• Precio: Alcanzó un máximo superior ($${p2_price})<br>` +
      `• RSI: Perdió fuerza y generó un pico menor (${p2_rsi} vs ${p1_rsi})<br>` +
      `• Volumen: Subida con menor volumen institucional (${p2_vol} BTC vs ${p1_vol} BTC)`;
  }

  const chartOpts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#e0e6ed' } } },
    scales: {
      x: { ticks: { color: '#9ba3af' }, grid: { color: '#2e3a50' } },
      y: { ticks: { color: '#9ba3af' }, grid: { color: '#2e3a50' } }
    }
  };

  // Renderizado de Gráficos
  new Chart(document.getElementById('priceChart'), {
    type: 'line',
    data: { labels: timeLabels, datasets: [{ label: 'Precio BTC (USDT)', data: priceData, borderColor: '#00e676', backgroundColor: 'rgba(0,230,118,0.1)', fill: true }] },
    options: chartOpts
  });

  new Chart(document.getElementById('rsiChart'), {
    type: 'line',
    data: { labels: timeLabels, datasets: [{ label: 'RSI (14)', data: rsiData, borderColor: '#ff9100' }] },
    options: chartOpts
  });

  new Chart(document.getElementById('macdChart'), {
    type: 'bar',
    data: { labels: timeLabels, datasets: [{ label: 'Histograma MACD', data: macdData, backgroundColor: macdData.map(v => v >= 0 ? '#29b6f6' : '#ef5350') }] },
    options: chartOpts
  });

  new Chart(document.getElementById('volumeChart'), {
    type: 'bar',
    data: { labels: timeLabels, datasets: [{ label: 'Volumen BTC', data: volumeData, backgroundColor: '#ab47bc' }] },
    options: chartOpts
  });
</script>

</body>
</html>
