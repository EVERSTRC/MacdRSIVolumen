<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estrategia BTC - Multi-Temporalidad</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #121826;
      color: #e0e6ed;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .timeframe-selector {
      display: flex;
      gap: 8px;
    }
    .tf-btn {
      background: #1e2738;
      border: 1px solid #2e3a50;
      color: #9ba3af;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .tf-btn:hover {
      background: #2b384e;
      color: #fff;
    }
    .tf-btn.active {
      background: #2962ff;
      color: #fff;
      border-color: #2962ff;
    }
    .alert-box {
      padding: 15px;
      border-radius: 6px;
      background-color: #2b1f31;
      border-left: 5px solid #ff4d4d;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ff6b6b;
      line-height: 1.5;
    }
    .chart-box {
      background: #1e2738;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    canvas {
      width: 100% !important;
      max-height: 200px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h2 style="margin: 0; color: #4da6ff;">BTC/USDT: Divergencia Multi-Temporalidad</h2>
    <div class="timeframe-selector">
      <button class="tf-btn" onclick="updateTimeframe('15m')">15m</button>
      <button class="tf-btn active" onclick="updateTimeframe('1h')">1H</button>
      <button class="tf-btn" onclick="updateTimeframe('4h')">4H</button>
      <button class="tf-btn" onclick="updateTimeframe('1d')">1D</button>
    </div>
  </div>

  <div id="alertBox" class="alert-box">
    Analizando temporalidad...
  </div>

  <div class="chart-box"><canvas id="priceChart"></canvas></div>
  <div class="chart-box"><canvas id="rsiChart"></canvas></div>
  <div class="chart-box"><canvas id="macdChart"></canvas></div>
  <div class="chart-box"><canvas id="volumeChart"></canvas></div>
</div>

<script>
  // Banco de Datos Simulado para cada Temporalidad
  const datasets = {
    '15m': {
      labels: ['14:00', '14:15', '14:30 (P1)', '14:45', '15:00', '15:15 (P2)', '15:30', '15:45'],
      price:  [63100, 63400, 63900, 63500, 63700, 64100, 63600, 63200],
      rsi:    [52,    65,    74,    58,    62,    66,    48,    40],
      macd:   [40,    110,   210,   90,    130,   150,   -20,   -90],
      volume: [450,   600,   1200,  500,   550,   750,   800,   950],
      divergence: true,
      score: '78%'
    },
    '1h': {
      labels: ['10:00', '11:00', '12:00 (P1)', '13:00', '14:00', '15:00 (P2)', '16:00', '17:00'],
      price:  [61000, 62500, 64000, 62800, 63500, 65200, 63000, 61500],
      rsi:    [48,    62,    79,    58,    64,    68,    45,    36],
      macd:   [120,   250,   480,   180,   220,   310,  -50,   -280],
      volume: [1200,  1800,  3100,  1400,  1600,  1900,  2200,  2800],
      divergence: true,
      score: '88%'
    },
    '4h': {
      labels: ['Ayer 08:00', 'Ayer 12:00', 'Ayer 16:00 (P1)', 'Ayer 20:00', 'Hoy 00:00', 'Hoy 04:00 (P2)', 'Hoy 08:00', 'Hoy 12:00'],
      price:  [58000, 60500, 63800, 62000, 63100, 66000, 64200, 62100],
      rsi:    [42,    58,    82,    52,    60,    65,    41,    33],
      macd:   [80,    310,   650,   210,   290,   380,  -120,  -450],
      volume: [3200,  4500,  8900,  3800,  4100,  5200,  6100,  7400],
      divergence: true,
      score: '94%'
    },
    '1d': {
      labels: ['20 Sep', '21 Sep', '22 Sep', '23 Sep', '24 Sep', '25 Sep', '26 Sep', '27 Sep'],
      price:  [55000, 58000, 61000, 59500, 62000, 63000, 62800, 61200],
      rsi:    [40,    50,    62,    53,    59,    61,    50,    44],
      macd:   [-100,  50,    200,   120,   180,   190,   10,    -110],
      volume: [15000, 18000, 22000, 16000, 17000, 17500, 19000, 21000],
      divergence: false,
      score: '30%'
    }
  };

  let priceChart, rsiChart, macdChart, volumeChart;

  const chartOpts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#e0e6ed' } } },
    scales: {
      x: { ticks: { color: '#9ba3af' }, grid: { color: '#2e3a50' } },
      y: { ticks: { color: '#9ba3af' }, grid: { color: '#2e3a50' } }
    }
  };

  function initCharts() {
    const ctxPrice  = document.getElementById('priceChart').getContext('2d');
    const ctxRsi    = document.getElementById('rsiChart').getContext('2d');
    const ctxMacd   = document.getElementById('macdChart').getContext('2d');
    const ctxVolume = document.getElementById('volumeChart').getContext('2d');

    priceChart  = new Chart(ctxPrice,  { type: 'line', data: { labels: [], datasets: [{ label: 'Precio BTC (USDT)', data: [], borderColor: '#00e676', backgroundColor: 'rgba(0,230,118,0.1)', fill: true }] }, options: chartOpts });
    rsiChart    = new Chart(ctxRsi,    { type: 'line', data: { labels: [], datasets: [{ label: 'RSI (14)', data: [], borderColor: '#ff9100' }] }, options: chartOpts });
    macdChart   = new Chart(ctxMacd,   { type: 'bar',  data: { labels: [], datasets: [{ label: 'Histograma MACD', data: [], backgroundColor: [] }] }, options: chartOpts });
    volumeChart = new Chart(ctxVolume, { type: 'bar',  data: { labels: [], datasets: [{ label: 'Volumen BTC', data: [], backgroundColor: '#ab47bc' }] }, options: chartOpts });

    updateTimeframe('1h');
  }

  function updateTimeframe(tf) {
    // Actualizar estados visuales de los botones
    document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
    event?.target?.classList.add('active') || document.querySelectorAll('.tf-btn')[1].classList.add('active');

    const data = datasets[tf];
    const alertBox = document.getElementById('alertBox');

    // Actualizar Alerta
    if (data.divergence) {
      alertBox.style.backgroundColor = '#2b1f31';
      alertBox.style.borderColor = '#ff4d4d';
      alertBox.style.color = '#ff6b6b';
      alertBox.innerHTML = `⚠️ SEÑAL DE VENTA DETECTADA EN TF [${tf.toUpperCase()}] (Fuerza de Señal: ${data.score})<br>` +
        `• El precio marcó un máximo más alto pero RSI, MACD y Volumen perdieron impulso.`;
    } else {
      alertBox.style.backgroundColor = '#1d2736';
      alertBox.style.borderColor = '#2962ff';
      alertBox.style.color = '#2962ff';
      alertBox.innerHTML = `ℹ️ TEMPORALIDAD [${tf.toUpperCase()}]: Sin divergencia confirmada (Mercado dentro de rangos normales).`;
    }

    // Actualizar datos de los gráficos
    [priceChart, rsiChart, macdChart, volumeChart].forEach(chart => {
      chart.data.labels = data.labels;
    });

    priceChart.data.datasets[0].data  = data.price;
    rsiChart.data.datasets[0].data    = data.rsi;
    macdChart.data.datasets[0].data   = data.macd;
    macdChart.data.datasets[0].backgroundColor = data.macd.map(v => v >= 0 ? '#29b6f6' : '#ef5350');
    volumeChart.data.datasets[0].data = data.volume;

    priceChart.update();
    rsiChart.update();
    macdChart.update();
    volumeChart.update();
  }

  window.onload = initCharts;
</script>

</body>
</html>
