<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estrategia BTC - Señales Automáticas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #121826;
      color: #e0e6ed;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .timeframe-selector {
      display: flex;
      gap: 8px;
    }
    .tf-btn {
      background: #1e2738;
      border: 1px solid #2e3a50;
      color: #9ba3af;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .tf-btn:hover {
      background: #2b384e;
      color: #fff;
    }
    .tf-btn.active {
      background: #2962ff;
      color: #fff;
      border-color: #2962ff;
    }
    
    /* Panel de Orden Automática */
    .trade-panel {
      background: #192233;
      border: 1px solid #2a3852;
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 20px;
    }
    .signal-header {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .signal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      background: #121826;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid #555;
    }
    .card.entry { border-left-color: #ffb74d; }
    .card.sl    { border-left-color: #ef5350; }
    .card.tp1   { border-left-color: #26a69a; }
    .card.tp2   { border-left-color: #00e676; }
    
    .card .label { font-size: 0.8rem; color: #9ba3af; font-weight: bold; text-transform: uppercase; }
    .card .value { font-size: 1.2rem; font-weight: bold; margin-top: 4px; color: #fff; }

    .chart-box {
      background: #1e2738;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    canvas {
      width: 100% !important;
      max-height: 180px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h2 style="margin: 0; color: #4da6ff;">🤖 Bot Autónomo BTC: Divergencias & Niveles</h2>
    <div class="timeframe-selector">
      <button class="tf-btn" onclick="updateTimeframe('15m')">15m</button>
      <button class="tf-btn active" onclick="updateTimeframe('1h')">1H</button>
      <button class="tf-btn" onclick="updateTimeframe('4h')">4H</button>
      <button class="tf-btn" onclick="updateTimeframe('1d')">1D</button>
    </div>
  </div>

  <!-- Panel de Orden Automático -->
  <div class="trade-panel">
    <div id="signalHeader" class="signal-header">Calculando parámetros...</div>
    <div class="signal-grid">
      <div class="card entry">
        <div class="label">🎯 Entrada (Short)</div>
        <div id="valEntry" class="value">-</div>
      </div>
      <div class="card sl">
        <div class="label">🛑 Stop Loss (SL)</div>
        <div id="valSL" class="value">-</div>
      </div>
      <div class="card tp1">
        <div class="label">💰 Take Profit 1</div>
        <div id="valTP1" class="value">-</div>
      </div>
      <div class="card tp2">
        <div class="label">🚀 Take Profit 2</div>
        <div id="valTP2" class="value">-</div>
      </div>
    </div>
  </div>

  <div class="chart-box"><canvas id="priceChart"></canvas></div>
  <div class="chart-box"><canvas id="rsiChart"></canvas></div>
  <div class="chart-box"><canvas id="macdChart"></canvas></div>
  <div class="chart-box"><canvas id="volumeChart"></canvas></div>
</div>

<script>
  // Banco de Datos por Temporalidad
  const datasets = {
    '15m': {
      labels: ['14:00', '14:15', '14:30 (P1)', '14:45 (Valle)', '15:00', '15:15 (P2)', '15:30', '15:45'],
      price:  [63100, 63400, 63900, 63300, 63700, 64100, 63600, 63200],
      rsi:    [52,    65,    74,    55,    62,    66,    48,    40],
      macd:   [40,    110,   210,   80,    130,   150,   -20,   -90],
      volume: [450,   600,   1200,  480,   550,   750,   800,   950],
      divergence: true,
      p1_idx: 2, valley_idx: 3, p2_idx: 5
    },
    '1h': {
      labels: ['10:00', '11:00', '12:00 (P1)', '13:00 (Valle)', '14:00', '15:00 (P2)', '16:00', '17:00'],
      price:  [61000, 62500, 64000, 62800, 63500, 65200, 63000, 61500],
      rsi:    [48,    62,    79,    58,    64,    68,    45,    36],
      macd:   [120,   250,   480,   180,   220,   310,  -50,   -280],
      volume: [1200,  1800,  3100,  1400,  1600,  1900,  2200,  2800],
      divergence: true,
      p1_idx: 2, valley_idx: 3, p2_idx: 5
    },
    '4h': {
      labels: ['08:00', '12:00', '16:00 (P1)', '20:00 (Valle)', '00:00', '04:00 (P2)', '08:00', '12:00'],
      price:  [58000, 60500, 63800, 62000, 63100, 66000, 64200, 62100],
      rsi:    [42,    58,    82,    52,    60,    65,    41,    33],
      macd:   [80,    310,   650,   210,   290,   380,  -120,  -450],
      volume: [3200,  4500,  8900,  3800,  4100,  5200,  6100,  7400],
      divergence: true,
      p1_idx: 2, valley_idx: 3, p2_idx: 5
    },
    '1d': {
      labels: ['20 Sep', '21 Sep', '22 Sep', '23 Sep', '24 Sep', '25 Sep', '26 Sep', '27 Sep'],
      price:  [55000, 58000, 61000, 59500, 62000, 63000, 62800, 61200],
      rsi:    [40,    50,    62,    53,    59,    61,    50,    44],
      macd:   [-100,  50,    200,   120,   180,   190,   10,    -110],
      volume: [15000, 18000, 22000, 16000, 17000, 17500, 19000, 21000],
      divergence: false
    }
  };

  let priceChart, rsiChart, macdChart, volumeChart;

  const chartOpts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#e0e6ed' } } },
    scales: {
      x: { ticks: { color: '#9ba3af' }, grid: { color: '#2e3a50' } },
      y: { ticks: { color: '#9ba3af' }, grid: { color: '#2e3a50' } }
    }
  };

  function initCharts() {
    priceChart  = new Chart(document.getElementById('priceChart').getContext('2d'),  { type: 'line', data: { labels: [], datasets: [{ label: 'Precio BTC (USDT)', data: [], borderColor: '#00e676', backgroundColor: 'rgba(0,230,118,0.1)', fill: true }] }, options: chartOpts });
    rsiChart    = new Chart(document.getElementById('rsiChart').getContext('2d'),    { type: 'line', data: { labels: [], datasets: [{ label: 'RSI (14)', data: [], borderColor: '#ff9100' }] }, options: chartOpts });
    macdChart   = new Chart(document.getElementById('macdChart').getContext('2d'),   { type: 'bar',  data: { labels: [], datasets: [{ label: 'Histograma MACD', data: [], backgroundColor: [] }] }, options: chartOpts });
    volumeChart = new Chart(document.getElementById('volumeChart').getContext('2d'), { type: 'bar',  data: { labels: [], datasets: [{ label: 'Volumen BTC', data: [], backgroundColor: '#ab47bc' }] }, options: chartOpts });

    updateTimeframe('1h');
  }

  function updateTimeframe(tf) {
    document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
    event?.target?.classList.add('active') || document.querySelectorAll('.tf-btn')[1].classList.add('active');

    const data = datasets[tf];

    // AUTOMATIZACIÓN DE CÁLCULO DE NIVELES
    if (data.divergence) {
      const peak2 = data.price[data.p2_idx];
      const valley = data.price[data.valley_idx];

      // Algoritmo de decisión
      const entryPrice = valley - 50;                     // Confirmación tras romper el valle
      const stopLoss   = peak2 + 300;                      // Un margen por encima del máximo local
      const risk       = stopLoss - entryPrice;
      const takeProfit1 = Math.round(entryPrice - risk * 1.5); // Ratio R:B 1:1.5
      const takeProfit2 = Math.round(entryPrice - risk * 2.5); // Ratio R:B 1:2.5

      document.getElementById('signalHeader').innerHTML = `<span style="color:#ff4d4d;">🔴 SEÑAL DE VENTA ACTIVA [${tf.toUpperCase()}]</span> — Divergencia Confirmada`;
      document.getElementById('valEntry').innerHTML = `$${entryPrice.toLocaleString()} <span style="font-size:0.7rem; color:#ffb74d;">(En rotura)</span>`;
      document.getElementById('valSL').innerHTML    = `$${stopLoss.toLocaleString()}`;
      document.getElementById('valTP1').innerHTML   = `$${takeProfit1.toLocaleString()}`;
      document.getElementById('valTP2').innerHTML   = `$${takeProfit2.toLocaleString()}`;
    } else {
      document.getElementById('signalHeader').innerHTML = `<span style="color:#2962ff;">⚪ ESPERAR [${tf.toUpperCase()}]</span> — Mercado sin patrón claro`;
      document.getElementById('valEntry').innerHTML = 'N/A';
      document.getElementById('valSL').innerHTML    = 'N/A';
      document.getElementById('valTP1').innerHTML   = 'N/A';
      document.getElementById('valTP2').innerHTML   = 'N/A';
    }

    // Actualizar datos de gráficos
    [priceChart, rsiChart, macdChart, volumeChart].forEach(chart => chart.data.labels = data.labels);

    priceChart.data.datasets[0].data  = data.price;
    rsiChart.data.datasets[0].data    = data.rsi;
    macdChart.data.datasets[0].data   = data.macd;
    macdChart.data.datasets[0].backgroundColor = data.macd.map(v => v >= 0 ? '#29b6f6' : '#ef5350');
    volumeChart.data.datasets[0].data = data.volume;

    priceChart.update();
    rsiChart.update();
    macdChart.update();
    volumeChart.update();
  }

  window.onload = initCharts;
</script>

</body>
</html>
