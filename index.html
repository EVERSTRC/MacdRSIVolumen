<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estrategia BTCUSD - Alarma Multitemporal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #121826;
      color: #e0e6ed;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .timeframe-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tf-btn {
      background: #1e2738;
      border: 1px solid #2e3a50;
      color: #9ba3af;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .tf-btn:hover { background: #2b384e; color: #fff; }
    .tf-btn.active { background: #2962ff; color: #fff; border-color: #2962ff; }
    
    /* Botón de Sonido / Alarma */
    .sound-btn {
      background: #00e676;
      color: #121826;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .sound-btn.muted {
      background: #ff4d4d;
      color: #fff;
    }

    .trade-panel {
      background: #192233;
      border: 1px solid #2a3852;
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 20px;
    }
    .signal-header {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .signal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      background: #121826;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid #555;
    }
    .card.entry { border-left-color: #ffb74d; }
    .card.sl    { border-left-color: #ef5350; }
    .card.tp1   { border-left-color: #26a69a; }
    .card.tp2   { border-left-color: #00e676; }
    
    .card .label { font-size: 0.8rem; color: #9ba3af; font-weight: bold; text-transform: uppercase; }
    .card .value { font-size: 1.2rem; font-weight: bold; margin-top: 4px; color: #fff; }

    .scanner-status {
      font-size: 0.85rem;
      color: #9ba3af;
      margin-top: 8px;
    }

    .chart-box {
      background: #1e2738;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    canvas { width: 100% !important; max-height: 180px; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h2 style="margin: 0; color: #4da6ff;">⚡ BTC/USD Live + Alarma Multi-TF</h2>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button id="soundToggle" class="sound-btn" onclick="toggleSound()">🔔 Alarma Activada</button>
      <div class="timeframe-selector">
        <button class="tf-btn" onclick="setTF('1m')">1m</button>
        <button class="tf-btn" onclick="setTF('5m')">5m</button>
        <button class="tf-btn" onclick="setTF('15m')">15m</button>
        <button class="tf-btn active" onclick="setTF('1h')">1H</button>
        <button class="tf-btn" onclick="setTF('4h')">4H</button>
        <button class="tf-btn" onclick="setTF('1d')">1D</button>
      </div>
    </div>
  </div>

  <div class="trade-panel">
    <div id="signalHeader" class="signal-header">Conectando con Binance...</div>
    <div class="signal-grid">
      <div class="card entry">
        <div class="label">🎯 Entrada (Short)</div>
        <div id="valEntry" class="value">-</div>
      </div>
      <div class="card sl">
        <div class="label">🛑 Stop Loss (SL)</div>
        <div id="valSL" class="value">-</div>
      </div>
      <div class="card tp1">
        <div class="label">💰 Take Profit 1</div>
        <div id="valTP1" class="value">-</div>
      </div>
      <div class="card tp2">
        <div class="label">🚀 Take Profit 2</div>
        <div id="valTP2" class="value">-</div>
      </div>
    </div>
    <div id="scannerStatus" class="scanner-status">Escáner global: Monitoreando todas las temporalidades cada 15s...</div>
  </div>

  <div class="chart-box"><canvas id="priceChart"></canvas></div>
  <div class="chart-box"><canvas id="rsiChart"></canvas></div>
  <div class="chart-box"><canvas id="macdChart"></canvas></div>
  <div class="chart-box"><canvas id="volumeChart"></canvas></div>
</div>

<script>
  let currentTF = '1h';
  let soundEnabled = true;
  let audioCtx = null;
  let lastAlertKey = '';
  let priceChart, rsiChart, macdChart, volumeChart;

  const timeframes = ['1m', '5m', '15m', '1h', '4h', '1d'];

  const chartOpts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#e0e6ed' } } },
    scales: {
      x: { ticks: { color: '#9ba3af' }, grid: { color: '#2e3a50' } },
      y: { ticks: { color: '#9ba3af' }, grid: { color: '#2e3a50' } }
    }
  };

  // Reproductor de Alarma Sonora (Web Audio API)
  function playAlarmSound() {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, now); // Nota A5
      osc.frequency.exponentialRampToValueAtTime(440, now + 0.5); // Desciende a A4

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.5);
    } catch (e) {
      console.warn("Error con Web Audio API:", e);
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundToggle');
    if (soundEnabled) {
      btn.className = 'sound-btn';
      btn.innerText = '🔔 Alarma Activada';
      playAlarmSound(); // Prueba de sonido rápida
    } else {
      btn.className = 'sound-btn muted';
      btn.innerText = '🔕 Alarma Silenciada';
    }
  }

  // Cálculos de Indicadores
  function calculateRSI(prices, period = 14) {
    let rsi = new Array(prices.length).fill(null);
    let gains = 0, losses = 0;

    for (let i = 1; i <= period; i++) {
      let diff = prices[i] - prices[i - 1];
      if (diff >= 0) gains += diff; else losses -= diff;
    }

    let avgGain = gains / period;
    let avgLoss = losses / period;
    rsi[period] = 100 - (100 / (1 + (avgGain / avgLoss)));

    for (let i = period + 1; i < prices.length; i++) {
      let diff = prices[i] - prices[i - 1];
      let gain = diff >= 0 ? diff : 0;
      let loss = diff < 0 ? -diff : 0;

      avgGain = (avgGain * (period - 1) + gain) / period;
      avgLoss = (avgLoss * (period - 1) + loss) / period;

      rsi[i] = avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
    }
    return rsi;
  }

  function calculateEMA(prices, period) {
    let k = 2 / (period + 1);
    let ema = [prices[0]];
    for (let i = 1; i < prices.length; i++) {
      ema.push(prices[i] * k + ema[i - 1] * (1 - k));
    }
    return ema;
  }

  function calculateMACD(prices) {
    let ema12 = calculateEMA(prices, 12);
    let ema26 = calculateEMA(prices, 26);
    let macdLine = ema12.map((val, idx) => val - ema26[idx]);
    let signalLine = calculateEMA(macdLine, 9);
    return macdLine.map((val, idx) => val - signalLine[idx]);
  }

  // Peticiones Binance
  async function fetchBinanceData(interval) {
    try {
      const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=50`);
      const rawData = await response.json();

      const labels = rawData.map(d => {
        let date = new Date(d[0]);
        let hrs = date.getHours().toString().padStart(2, '0');
        let mins = date.getMinutes().toString().padStart(2, '0');
        return `${hrs}:${mins}`;
      });
      const prices = rawData.map(d => parseFloat(d[4]));
      const highs  = rawData.map(d => parseFloat(d[2]));
      const lows   = rawData.map(d => parseFloat(d[3]));
      const volumes= rawData.map(d => parseFloat(d[5]));

      const rsi  = calculateRSI(prices);
      const macd = calculateMACD(prices);

      return { interval, labels, prices, highs, lows, rsi, macd, volumes };
    } catch (err) {
      console.error("Error Binance API:", err);
      return null;
    }
  }

  // Escáner Global Multitemporal
  async function scanAllTimeframes() {
    let detectedSignals = [];

    for (let tf of timeframes) {
      const data = await fetchBinanceData(tf);
      if (!data) continue;

      const result = checkDivergence(data.highs, data.lows, data.rsi, data.volumes);
      if (result.hasDivergence) {
        detectedSignals.push({ tf, ...result });

        // Activar alarma sonora si es una señal nueva
        const alertKey = `${tf}_${data.highs[result.p2]}`;
        if (alertKey !== lastAlertKey) {
          lastAlertKey = alertKey;
          playAlarmSound();
        }
      }

      // Si es la temporalidad seleccionada, actualizar gráficos
      if (tf === currentTF) {
        updateUI(data, result);
      }
    }

    const scannerDiv = document.getElementById('scannerStatus');
    if (detectedSignals.length > 0) {
      const tfList = detectedSignals.map(s => s.tf.toUpperCase()).join(', ');
      scannerDiv.innerHTML = `🔥 <b style="color:#ff4d4d;">ALERTA GLOBAL:</b> Divergencia activa detectada en [${tfList}]`;
    } else {
      scannerDiv.innerHTML = `🟢 Escáner global activo: Sin divergencias en otros marcos temporales.`;
    }
  }

  // Detección Lógica
  function checkDivergence(highs, lows, rsi, volumes) {
    const n = highs.length - 1;
    let p2 = n - 1, p1 = null, valley = null;

    for (let i = n - 2; i > n - 25; i--) {
      if (highs[i] > highs[i-1] && highs[i] > highs[i+1]) {
        if (!p1 && highs[i] < highs[p2]) {
          p1 = i;
          break;
        }
      }
    }

    if (p1) {
      let minLow = Infinity;
      for (let i = p1; i <= p2; i++) {
        if (lows[i] < minLow) {
          minLow = lows[i];
          valley = i;
        }
      }

      const divPrice  = highs[p2] > highs[p1];
      const divRSI    = rsi[p2] < rsi[p1];
      const divVolume = volumes[p2] < volumes[p1];

      if (divPrice && divRSI) {
        return { hasDivergence: true, p1, p2, valley };
      }
    }
    return { hasDivergence: false };
  }

  // Actualizar Interfaz
  function updateUI(data, divResult) {
    if (divResult.hasDivergence) {
      const offset = (currentTF === '1m' || currentTF === '5m') ? 5 : 20;
      const slPct  = (currentTF === '1m' || currentTF === '5m') ? 0.002 : 0.005;

      const entryPrice  = Math.round(data.lows[divResult.valley] - offset);
      const stopLoss    = Math.round(data.highs[divResult.p2] + (data.highs[divResult.p2] * slPct));
      const risk        = stopLoss - entryPrice;
      const takeProfit1 = Math.round(entryPrice - (risk * 1.5));
      const takeProfit2 = Math.round(entryPrice - (risk * 2.5));

      document.getElementById('signalHeader').innerHTML = `<span style="color:#ff4d4d;">🔴 SEÑAL DE VENTA [${currentTF.toUpperCase()}]</span>`;
      document.getElementById('valEntry').innerHTML = `$${entryPrice.toLocaleString()} USD`;
      document.getElementById('valSL').innerHTML    = `$${stopLoss.toLocaleString()} USD`;
      document.getElementById('valTP1').innerHTML   = `$${takeProfit1.toLocaleString()} USD`;
      document.getElementById('valTP2').innerHTML   = `$${takeProfit2.toLocaleString()} USD`;
    } else {
      document.getElementById('signalHeader').innerHTML = `<span style="color:#2962ff;">⚪ ESPERAR [${currentTF.toUpperCase()}]</span> — Sin Divergencia`;
      document.getElementById('valEntry').innerHTML = 'N/A';
      document.getElementById('valSL').innerHTML    = 'N/A';
      document.getElementById('valTP1').innerHTML   = 'N/A';
      document.getElementById('valTP2').innerHTML   = 'N/A';
    }

    // Actualizar Gráficos
    [priceChart, rsiChart, macdChart, volumeChart].forEach(c => c.data.labels = data.labels);
    priceChart.data.datasets[0].data  = data.prices;
    rsiChart.data.datasets[0].data    = data.rsi;
    macdChart.data.datasets[0].data   = data.macd;
    macdChart.data.datasets[0].backgroundColor = data.macd.map(v => v >= 0 ? '#29b6f6' : '#ef5350');
    volumeChart.data.datasets[0].data = data.volumes;

    priceChart.update();
    rsiChart.update();
    macdChart.update();
    volumeChart.update();
  }

  function setTF(tf) {
    currentTF = tf;
    document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
    event?.target?.classList.add('active');
    scanAllTimeframes();
  }

  window.onload = () => {
    priceChart  = new Chart(document.getElementById('priceChart').getContext('2d'),  { type: 'line', data: { labels: [], datasets: [{ label: 'Precio BTC/USD (Binance)', data: [], borderColor: '#00e676', backgroundColor: 'rgba(0,230,118,0.1)', fill: true }] }, options: chartOpts });
    rsiChart    = new Chart(document.getElementById('rsiChart').getContext('2d'),    { type: 'line', data: { labels: [], datasets: [{ label: 'RSI (14)', data: [], borderColor: '#ff9100' }] }, options: chartOpts });
    macdChart   = new Chart(document.getElementById('macdChart').getContext('2d'),   { type: 'bar',  data: { labels: [], datasets: [{ label: 'Histograma MACD', data: [], backgroundColor: [] }] }, options: chartOpts });
    volumeChart = new Chart(document.getElementById('volumeChart').getContext('2d'), { type: 'bar',  data: { labels: [], datasets: [{ label: 'Volumen BTC', data: [], backgroundColor: '#ab47bc' }] }, options: chartOpts });

    // Primera ejecución y programar escáner en segundo plano cada 15s
    scanAllTimeframes();
    setInterval(scanAllTimeframes, 15000);
  };
</script>

</body>
</html>
